name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # weekly notebook execution (Mon 03:00 UTC)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install library and dev tools
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Format check (ruff)
        run: ruff format --check src tests scripts

      - name: Notebook format gate
        run: python scripts/normalize_notebooks.py --check

      - name: Run unit tests with coverage report
        run: pytest --cov=ml_first_principles --cov-report=term

  notebooks:
    # Full fresh-kernel execution of all notebooks — too slow for per-push CI.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned environment and dev tools
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Execute all notebooks (read-only)
        run: python scripts/execute_all_notebooks.py
