[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-first-principles"
version = "0.3.0"
description = "Machine Learning from First Principles — from-scratch implementations with mathematical derivations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Hien"}
]
keywords = ["machine-learning", "first-principles", "from-scratch", "mathematical-modeling"]

dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "pandas>=2.0",
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
    "ipywidgets>=8.0",
    "nbformat>=5.10",
    "nbclient>=0.8",
]

[project.scripts]
mlfp = "ml_first_principles._tooling.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "nbclient>=0.8",
    "ruff>=0.1",
    "mypy>=1.8",
]
deep-learning = [
    "torch>=2.0",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-jupyter>=0.25",
    "mkdocs-awesome-nav>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ml_first_principles = ["py.typed"]

[tool.coverage.run]
# _tooling is repo workflow (the mlfp CLI), not library API; CI exercises it
# directly by running the gates themselves.
omit = ["*/_tooling/*"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
# Ratchet plan (CONTRIBUTING.md Phase 5): enable disallow_untyped_defs, then strict,
# module by module as the codebase is annotated.

[[tool.mypy.overrides]]
module = ["sklearn.*", "matplotlib.*", "scipy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
